<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards Rugby - The Floor</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        #card-container {
            background-color: #1e1e1e;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 380px;
            text-align: center;
        }

        .image-wrapper {
            width: 320px;
            height: 400px;
            border-radius: 12px;
            overflow: hidden;
            background-color: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #player-name {
            font-size: 1.8rem;
            font-weight: bold;
            min-height: 2.2rem;
            color: #4da6ff;
            visibility: hidden;
            margin: 10px 0;
        }

        #player-name.visible {
            visibility: visible;
        }

        .instructions {
            font-size: 0.9rem;
            color: #888888;
            margin-top: 15px;
        }

        #counter {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 10px;
        }

        .key-badge {
            background: #333;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid #555;
            color: #fff;
        }
    </style>
</head>
<body>

    <div id="card-container">
        <div id="counter">1 / 100</div>
        <div class="image-wrapper">
            <img id="player-img" src="" alt="Chargement...">
        </div>
        <div id="player-name">---</div>
        <div class="instructions">
            Appuyez sur <span class="key-badge">Espace</span> pour révéler / passer à la suivante
        </div>
    </div>

    <script>
        const players = [
            // Légendes Françaises
            "Antoine Dupont", "Romain Ntamack", "Thierry Dusautoir", "Serge Blanco", "Frédéric Michalak", 
            "Fabien Pelous", "Vincent Clerc", "Christophe Dominici", "Raphaël Ibañez", "Thomas Ramos",
            "Damian Penaud", "Gregory Alldritt", "Charles Ollivon", "Gaël Fickou", "Mathieu Jalibert",
            "Imanol Harinordoquy", "Philippe Sella", "Jean-Pierre Rives", "Yachvili Dimitri", "Aurélien Rougerie",
            "Sebastien Chabal", "Yannick Jauzion", "William Servat", "Morgan Parra", "Uini Atonio",
            "Cyril Baille", "Julian Marchand", "Camille Chat", "Anthony Jelonch", "Bernard Le Roux",
            "François Trinh-Duc", "Maxime Médard", "Louis Picamoles", "Florian Fritz", "Sylvain Marconnet",

            // Légendes Internationales
            "Jonny Wilkinson", "Dan Carter", "Richie McCaw", "Brian O'Driscoll", "Shane Williams",
            "Siya Kolisi", "Cheslin Kolbe", "Eben Etzebeth", "Faf de Klerk", "Bryan Habana",
            "Lomu Jonah", "Beauden Barrett", "Ardie Savea", "Aaron Smith", "Ma'a Nonu",
            "Bodie Retallick", "Kieran Read", "David Pocock", "Michael Hooper", "George Gregan",
            "Maro Itoje", "Owen Farrell", "Courtney Lawes", "Manu Tuilagi", "Alun Wyn Jones",
            "George North", "Louis Rees-Zammit", "Finn Russell", "Stuart Hogg", "Ronan O'Gara",
            "Johnny Sexton", "Tadhg Furlong", "Josh van der Flier", "Sergio Parisse", "Ange Capuozzo",

            // Joueurs Tendances & Stars actuelles
            "Bundee Aki", "Jamison Gibson-Park", "Hugo Keenan", "Caelan Doris", "Duhan van der Merwe",
            "Marcus Smith", "Ben Earl", "Ellis Genge", "Freddie Steward", "Handré Pollard",
            "Pieter-Steph du Toit", "Lukhanyo Am", "Damian de Allende", "Will Jordan", "Rieko Ioane",
            "Jordie Barrett", "Damian McKenzie", "Scott Barrett", "Pablo Matera", "Emiliano Boffelli",
            "Finn Russell", "Blair Kinghorn", "Mack Hansen", "James Lowe", "Gabin Villière"
        ];

        let currentIndex = 0;
        let isAnswerRevealed = false;

        const imgElement = document.getElementById('player-img');
        const nameElement = document.getElementById('player-name');
        const counterElement = document.getElementById('counter');

        // Mélanger les joueurs au lancement
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        async function fetchWikipediaImage(playerName) {
            imgElement.src = "";
            imgElement.alt = "Chargement...";
            try {
                const response = await fetch(`https://fr.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(playerName)}`);
                const data = await response.json();
                if (data.thumbnail && data.thumbnail.source) {
                    // Remplace la miniature par une version plus haute résolution
                    return data.thumbnail.source.replace(/\/\d+px-/, '/600px-');
                } else {
                    return "https://via.placeholder.com/320x400?text=Photo+Non+Trouvee";
                }
            } catch (error) {
                return "https://via.placeholder.com/320x400?text=Erreur+Chargement";
            }
        }

        async function loadCard() {
            isAnswerRevealed = false;
            nameElement.classList.remove('visible');
            nameElement.textContent = players[currentIndex];
            counterElement.textContent = `${currentIndex + 1} / ${players.length}`;
            
            const imageUrl = await fetchWikipediaImage(players[currentIndex]);
            imgElement.src = imageUrl;
        }

        document.addEventListener('keydown', (event) => {
            if (event.code === 'Space') {
                event.preventDefault(); // Empêche le défilement de la page
                
                if (!isAnswerRevealed) {
                    // 1er appui sur Espace : révèle le nom
                    nameElement.classList.add('visible');
                    isAnswerRevealed = true;
                } else {
                    // 2ème appui sur Espace : passe au suivant
                    currentIndex = (currentIndex + 1) % players.length;
                    loadCard();
                }
            }
        });

        // Démarrage
        shuffle(players);
        loadCard();
    </script>
</body>
</html>
