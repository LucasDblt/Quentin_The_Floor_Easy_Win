<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entraînement The Floor - Flashcards</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            user-select: none;
        }

        #menu-container {
            background-color: #1e1e1e;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 380px;
            text-align: center;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            background-color: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            font-size: 1rem;
            margin: 15px 0;
            cursor: pointer;
        }

        button {
            background-color: #4da6ff;
            color: #121212;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            margin-top: 10px;
        }

        button:hover {
            background-color: #3385d6;
        }

        button.hard-mode-btn {
            background-color: #ffb84d;
            color: #121212;
        }

        button.hard-mode-btn:hover {
            background-color: #e69900;
        }

        #loader-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .progress-bar-container {
            width: 300px;
            height: 12px;
            background-color: #333;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 15px;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background-color: #4da6ff;
            transition: width 0.1s ease;
        }

        #card-container {
            background-color: #1e1e1e;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: none;
            flex-direction: column;
            align-items: center;
            width: 380px;
            text-align: center;
            position: relative;
            cursor: pointer;
        }

        .image-wrapper {
            width: 320px;
            height: 400px;
            border-radius: 12px;
            overflow: hidden;
            background-color: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        .text-card {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            font-size: 1.6rem;
            font-weight: bold;
            color: #fff;
            text-align: center;
            line-height: 1.3;
            pointer-events: none;
        }

        #item-answer {
            font-size: 1.8rem;
            font-weight: bold;
            min-height: 2.2rem;
            color: #4da6ff;
            visibility: hidden;
            margin: 5px 0;
            pointer-events: none;
        }

        #item-answer.visible {
            visibility: visible;
        }

        .action-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            width: 100%;
        }

        .fav-btn {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #aaa;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: auto;
            margin: 0;
        }

        .fav-btn.active {
            background: #ffb84d;
            color: #121212;
            border-color: #ffb84d;
            font-weight: bold;
        }

        .instructions {
            font-size: 0.85rem;
            color: #888888;
            margin-top: 15px;
            line-height: 1.4;
            pointer-events: none;
        }

        #counter {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 10px;
            pointer-events: none;
        }

        .key-badge {
            background: #333;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #555;
            color: #fff;
        }

        #back-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            width: auto;
            padding: 5px 10px;
            font-size: 0.8rem;
            background-color: #333;
            color: #ccc;
            margin: 0;
        }
    </style>
</head>
<body>

    <!-- Menu de sélection -->
    <div id="menu-container">
        <h2>Entraînement The Floor</h2>
        <p>Choisissez votre catégorie :</p>
        <select id="theme-select"></select>
        <button onclick="startTheme(false)">Lancer la session</button>
        <button id="hard-mode-btn" class="hard-mode-btn" onclick="startTheme(true)">
             Mode Révision (0 carte)
        </button>
    </div>

    <!-- Écran de chargement -->
    <div id="loader-screen">
        <h2 id="loader-title">Préchargement...</h2>
        <div id="load-status">0 / 0 éléments prêts</div>
        <div class="progress-bar-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
    </div>

    <!-- Interface Flashcard -->
    <div id="card-container">
        <button id="back-btn" onclick="returnToMenu()">← Menu</button>
        <div id="counter">Chargement...</div>
        <div class="image-wrapper" id="display-wrapper">
            <!-- Image ou texte inséré dynamiquement -->
        </div>
        <div id="item-answer">---</div>
        
        <div class="action-row">
            <button id="toggle-fav-btn" class="fav-btn" onclick="toggleFavorite()">
                <span id="star-icon">☆</span> À revoir (Dur)
            </button>
        </div>

        <div class="instructions">
            <span class="key-badge">Espace</span> ou <strong>Toucher l'écran</strong> : Révéler / Suivant<br>
            <span class="key-badge">↑ Flèche Haut</span> : Marquer comme dur
        </div>
    </div>

            "50": { name: "50. LANGUE - Dictons & expressions", type: "text", items: [
                {q: "En avril, ne te découvre pas d'un fil...", a: "...en mai, fais ce qu'il te plaît."},
                {q: "Qui sème le vent...", a: "...récolte la tempête."},
                {q: "Passez une patte de lapin...", a: "...porter bonheur"},
                {q: "Mettre la charrue...", a: "...avant les bœufs."},
                {q: "Pierre qui roule...", a: "...n'amasse pas mousse."},
                {q: "Après la pluie...", a: "...le beau temps."},
                {q: "Il ne faut pas vendre la peau de l'ours...", a: "...avant de l'avoir tué."},
                {q: "Quand le chat n'est pas là...", a: "...les souris dansent."},
                {q: "Les chiens aboient...", a: "...la caravane passe."},
                {q: "Rien ne sert de courir...", a: "...il faut partir à point."},
                {q: "L'habit ne fait pas...", a: "...le moine."},
                {q: "L'union fait...", a: "...la force."},
                {q: "Tout ce qui brille...", a: "...n'est pas or."},
                {q: "Mieux vaut tard...", a: "...que jamais."},
                {q: "Abondance de biens...", a: "...ne nuit pas."},
                {q: "Aux innocents...", a: "...les mains pleines."},
                {q: "C'est la goutte d'eau...", a: "...qui fait déborder le vase."},
                {q: "Ce n'est pas au vieil singe...", a: "...qu'on apprend à faire des grimaces."},
                {q: "Chassez le naturel...", a: "...il revient au galop."},
                {q: "L'erreur est...", a: "...humaine."},
                {q: "La nuit tous les chats...", a: "...sont gris."},
                {q: "La vérité sort de la bouche...", a: "...des enfants."},
                {q: "Les absents ont...", a: "...toujours tort."},
                {q: "Les grands esprits...", a: "...se rencontrent."},
                {q: "Les murs ont...", a: "...des oreilles."},
                {q: "Nul n'est prophète...", a: "...en son pays."},
                {q: "Oeil pour oeil...", a: "...dent pour dent."},
                {q: "On ne fait pas d'omelette...", a: "...sans casser des oeufs."},
                {q: "On ne mélange pas les serviettes...", a: "...et les torchons."},
                {q: "Petit a petit, l'oiseau...", a: "...fait son nid."},
                {q: "Quand on parle du loup...", a: "...on en voit la queue."},
                {q: "Qui aime bien...", a: "...châtie bien."},
                {q: "Qui dort...", a: "...dîne."},
                {q: "Qui paie ses dettes...", a: "...s'enrichit."},
                {q: "Qui trop embrasse...", a: "...mal étreint."},
                {q: "Qui vole un oeuf...", a: "...vole un boeuf."},
                {q: "Rira bien...", a: "...qui rira le dernier."},
                {q: "Tant va la cruche a l'eau...", a: "...qu'a la fin elle se casse."},
                {q: "Tous les chemins...", a: "...mènent à Rome."},
                {q: "Une de perdue...", a: "...dix de retrouvées."},
                {q: "Ventre affamé...", a: "...n'a pas d'oreilles."},
                {q: "Vouloir, c'est...", a: "...pouvoir."},
                {q: "A bon chat...", a: "...bon rat."},
                {q: "A cheval donné...", a: "...on ne regarde pas les dents."},
                {q: "Au royaume des aveugles...", a: "...les borgnes sont rois."},
                {q: "Autant chercher une aiguille...", a: "...dans une botte de foin."},
                {q: "C'est au pied du mur...", a: "...qu'on voit le maçon."},
                {q: "C'est l'hôpital...", a: "...qui se moque de la charité."},
                {q: "Chacun voit la midi...", a: "...à sa porte."},
                {q: "Comme on fait son lit...", a: "...on se couche."},
                {q: "En avril, ne te découvre pas d'un fil...", a: "...en mai, fais ce qu'il te plaît."},
                {q: "Passez une patte de lapin...", a: "...porter bonheur"}
            ]},

                {q: "Abondance de biens...", a: "...ne nuit pas."},
                {q: "Aux innocents...", a: "...les mains pleines."},
                {q: "C'est la goutte d'eau...", a: "...qui fait déborder le vase."},
                {q: "Ce n'est pas au vieil singe...", a: "...qu'on apprend à faire des grimaces."},
                {q: "Chassez le naturel...", a: "...il revient au galop."},
                {q: "L'erreur est...", a: "...humaine."},
                {q: "La nuit tous les chats...", a: "...sont gris."},
                {q: "La vérité sort de la bouche...", a: "...des enfants."},
                {q: "Les absents ont...", a: "...toujours tort."},
                {q: "Les grands esprits...", a: "...se rencontrent."},
                {q: "Les murs ont...", a: "...des oreilles."},
                {q: "Nul n'est prophète...", a: "...en son pays."},
                {q: "Oeil pour oeil...", a: "...dent pour dent."},
                {q: "On ne fait pas d'omelette...", a: "...sans casser des oeufs."},
                {q: "On ne mélange pas les serviettes...", a: "...et les torchons."},
                {q: "Petit a petit, l'oiseau...", a: "...fait son nid."},
                {q: "Quand on parle du loup...", a: "...on en voit la queue."},
                {q: "Qui aime bien...", a: "...châtie bien."},
                {q: "Qui dort...", a: "...dîne."},
                {q: "Qui paie ses dettes...", a: "...s'enrichit."},
                {q: "Qui trop embrasse...", a: "...mal étreint."},
                {q: "Qui vole un oeuf...", a: "...vole un boeuf."},
                {q: "Rira bien...", a: "...qui rira le dernier."},
                {q: "Tant va la cruche a l'eau...", a: "...qu'a la fin elle se casse."},
                {q: "Tous les chemins...", a: "...mènent à Rome."},
                {q: "Une de perdue...", a: "...dix de retrouvées."},
                {q: "Ventre affamé...", a: "...n'a pas d'oreilles."},
                {q: "Vouloir, c'est...", a: "...pouvoir."},
                {q: "A bon chat...", a: "...bon rat."},
                {q: "A cheval donné...", a: "...on ne regarde pas les dents."},
                {q: "Au royaume des aveugles...", a: "...les borgnes sont rois."},
                {q: "Autant chercher une aiguille...", a: "...dans une botte de foin."},
                {q: "C'est au pied du mur...", a: "...qu'on voit le maçon."},
                {q: "C'est l'hôpital...", a: "...qui se moque de la charité."},
                {q: "Chacun voit la midi...", a: "...à sa porte."},
                {q: "Comme on fait son lit...", a: "...on se couche."},
                {q: "En avril, ne te découvre pas d'un fil...", a: "...en mai, fais ce qu'il te plaît."},
                {q: "Passez une patte de lapin...", a: "...porter bonheur"}
            ]},

        let currentTheme = null;
        let preloadedData = [];
        let currentIndex = 0;
        let isAnswerRevealed = false;
        let favorites = JSON.parse(localStorage.getItem('tf_favorites')) || [];

        const menuContainer = document.getElementById('menu-container');
        const themeSelect = document.getElementById('theme-select');
        const loaderScreen = document.getElementById('loader-screen');
        const cardContainer = document.getElementById('card-container');
        const loadStatus = document.getElementById('load-status');
        const progressBar = document.getElementById('progress-bar');
        const loaderTitle = document.getElementById('loader-title');
        const displayWrapper = document.getElementById('display-wrapper');
        const itemAnswer = document.getElementById('item-answer');
        const counterElement = document.getElementById('counter');
        const hardModeBtn = document.getElementById('hard-mode-btn');
        const toggleFavBtn = document.getElementById('toggle-fav-btn');
        const starIcon = document.getElementById('star-icon');

        function updateFavoritesMenu() {
            hardModeBtn.textContent = `🎯 Mode Révision (${favorites.length} enregistrés)`;
            if (favorites.length === 0) {
                hardModeBtn.style.opacity = '0.5';
                hardModeBtn.style.cursor = 'not-allowed';
            } else {
                hardModeBtn.style.opacity = '1';
                hardModeBtn.style.cursor = 'pointer';
            }
        }

        function initMenu() {
            themeSelect.innerHTML = "";
            for (let key in themesData) {
                let opt = document.createElement('option');
                opt.value = key;
                opt.textContent = themesData[key].name;
                themeSelect.appendChild(opt);
            }
            updateFavoritesMenu();
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        async function fetchImageUrl(query) {
            try {
                const res = await fetch(`https://fr.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(query)}`);
                const data = await res.json();
                if (data.thumbnail && data.thumbnail.source) {
                    return data.thumbnail.source;
                }
            } catch (e) {}
            try {
                const res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(query)}`);
                const data = await res.json();
                if (data.thumbnail && data.thumbnail.source) {
                    return data.thumbnail.source;
                }
            } catch (e) {}
            return "https://via.placeholder.com/320x400?text=Image+Non+Trouvée";
        }

        async function startTheme(onlyFavorites = false) {
            if (onlyFavorites && favorites.length === 0) {
                alert("Vous n'avez encore marqué aucune carte comme 'Dure' !");
                return;
            }

            menuContainer.style.display = 'none';
            loaderScreen.style.display = 'flex';
            
            preloadedData = [];
            currentIndex = 0;

            let itemsToLoad = [];

            if (onlyFavorites) {
                loaderTitle.textContent = "Chargement des cartes dures...";
                itemsToLoad = [...favorites];
            } else {
                const selectedKey = themeSelect.value;
                currentTheme = themesData[selectedKey];
                loaderTitle.textContent = `Chargement de ${currentTheme.name}...`;

                if (currentTheme.type === "image") {
                    itemsToLoad = currentTheme.items.map(name => ({ name, type: "image", themeKey: selectedKey }));
                } else {
                    itemsToLoad = currentTheme.items.map(item => ({ q: item.q, a: item.a, type: "text", themeKey: selectedKey }));
                }
            }

            shuffle(itemsToLoad);

            let loadedCount = 0;
            const batchSize = 5;

            for (let i = 0; i < itemsToLoad.length; i += batchSize) {
                const chunk = itemsToLoad.slice(i, i + batchSize);
                const promises = chunk.map(async (item) => {
                    if (item.type === "image") {
                        const url = await fetchImageUrl(item.name);
                        await new Promise((resolve) => {
                            const img = new Image();
                            img.onload = resolve;
                            img.onerror = resolve;
                            img.src = url;
                        });
                        return { id: item.name, question: item.name, answer: item.name, url: url, type: "image" };
                    } else {
                        return { id: item.a, question: item.q, answer: item.a, type: "text" };
                    }
                });

                const results = await Promise.all(promises);
                preloadedData.push(...results);

                loadedCount += chunk.length;
                loadStatus.textContent = `${loadedCount} / ${itemsToLoad.length} éléments prêts`;
                progressBar.style.width = `${(loadedCount / itemsToLoad.length) * 100}%`;
            }

            loaderScreen.style.display = 'none';
            cardContainer.style.display = 'flex';
            loadCard();
        }

        function loadCard() {
            isAnswerRevealed = false;
            itemAnswer.classList.remove('visible');
            
            const currentItem = preloadedData[currentIndex];
            itemAnswer.textContent = currentItem.answer;
            counterElement.textContent = `${currentIndex + 1} / ${preloadedData.length}`;

            displayWrapper.innerHTML = "";

            if (currentItem.type === "image") {
                const img = document.createElement('img');
                img.src = currentItem.url;
                displayWrapper.appendChild(img);
            } else {
                const textDiv = document.createElement('div');
                textDiv.className = "text-card";
                textDiv.textContent = currentItem.question;
                displayWrapper.appendChild(textDiv);
            }

            updateFavButtonUI();
        }

        function isCurrentFav() {
            const currentItem = preloadedData[currentIndex];
            return favorites.some(f => f.name === currentItem.id || f.a === currentItem.id);
        }

        function updateFavButtonUI() {
            if (isCurrentFav()) {
                toggleFavBtn.classList.add('active');
                starIcon.textContent = "★";
            } else {
                toggleFavBtn.classList.remove('active');
                starIcon.textContent = "☆";
            }
        }

        function toggleFavorite() {
            const currentItem = preloadedData[currentIndex];
            
            let existingIndex = favorites.findIndex(f => f.name === currentItem.id || f.a === currentItem.id);

            if (existingIndex !== -1) {
                favorites.splice(existingIndex, 1);
            } else {
                if (currentItem.type === "image") {
                    favorites.push({ name: currentItem.id, type: "image" });
                } else {
                    favorites.push({ q: currentItem.question, a: currentItem.answer, type: "text" });
                }
            }

            localStorage.setItem('tf_favorites', JSON.stringify(favorites));
            updateFavButtonUI();
            updateFavoritesMenu();
        }

        function returnToMenu() {
            cardContainer.style.display = 'none';
            menuContainer.style.display = 'block';
            updateFavoritesMenu();
        }

        function handleAction() {
            if (cardContainer.style.display === 'flex') {
                if (!isAnswerRevealed) {
                    itemAnswer.classList.add('visible');
                    isAnswerRevealed = true;
                } else {
                    currentIndex = (currentIndex + 1) % preloadedData.length;
                    loadCard();
                }
            }
        }

        // Action Clavier (Ordinateur)
        document.addEventListener('keydown', (event) => {
            if (cardContainer.style.display === 'flex') {
                if (event.code === 'Space') {
                    event.preventDefault();
                    handleAction();
                } else if (event.code === 'ArrowUp') {
                    event.preventDefault();
                    toggleFavorite();
                }
            }
        });

        // Action Clic / Tap Écran (Mobile & Souris)
        cardContainer.addEventListener('click', (event) => {
            if (event.target.tagName === 'BUTTON' || event.target.closest('button')) {
                return;
            }
            handleAction();
        });

        initMenu();
    </script>
