<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards Joueurs de Rugby - The Floor</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        #loader-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .progress-bar-container {
            width: 300px;
            height: 12px;
            background-color: #333;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 15px;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background-color: #4da6ff;
            transition: width 0.1s ease;
        }

        #card-container {
            background-color: #1e1e1e;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: none;
            flex-direction: column;
            align-items: center;
            width: 380px;
            text-align: center;
        }

        .image-wrapper {
            width: 320px;
            height: 400px;
            border-radius: 12px;
            overflow: hidden;
            background-color: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #player-name {
            font-size: 1.8rem;
            font-weight: bold;
            min-height: 2.2rem;
            color: #4da6ff;
            visibility: hidden;
            margin: 10px 0;
        }

        #player-name.visible {
            visibility: visible;
        }

        .instructions {
            font-size: 0.9rem;
            color: #888888;
            margin-top: 15px;
        }

        #counter {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 10px;
        }

        .key-badge {
            background: #333;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid #555;
            color: #fff;
        }
    </style>
</head>
<body>

    <div id="loader-screen">
        <h2>Préchargement des 100 joueurs...</h2>
        <div id="load-status">0 / 100 joueurs prêts</div>
        <div class="progress-bar-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
    </div>

    <div id="card-container">
        <div id="counter">1 / 100</div>
        <div class="image-wrapper">
            <img id="player-img" src="" alt="">
        </div>
        <div id="player-name">---</div>
        <div class="instructions">
            Appuyez sur <span class="key-badge">Espace</span> pour révéler / passer à la suivante
        </div>
    </div>

    <script>
        const players = [
            // XV de France Actuel & Stars Top 14 (35)
            "Antoine Dupont", "Romain Ntamack", "Thomas Ramos", "Damian Penaud", "Gregory Alldritt",
            "Charles Ollivon", "Gaël Fickou", "Mathieu Jalibert", "Cyril Baille", "Julien Marchand",
            "Uini Atonio", "Cameron Woki", "Anthony Jelonch", "Peato Mauvaka", "Melvyn Jaminet",
            "Gabin Villière", "Maxime Lucu", "Louis Bielle-Biarrey", "Yoram Moefana", "Thibaud Flament",
            "François Cros", "Paul Willemse", "Bernard Le Roux", "Jonathan Danty", "Arthur Vincent",
            "Sipili Falatea", "Reda Wardi", "Romain Taofifénua", "Sekou Macalou", "Baptiste Couilloud",
            "Nolann Le Garrec", "Antoine Hastoy", "Posolo Tuilagi", "Léo Barré", "Emilien Gailleton",

            // Ancien Bleus & Légendes des années 2000-2010 (35)
            "Sébastien Chabal", "Thierry Dusautoir", "Frédéric Michalak", "Vincent Clerc", "Fabien Pelous",
            "Christophe Dominici", "Raphaël Ibañez", "Imanol Harinordoquy", "Dimitri Yachvili", "Aurélien Rougerie",
            "Yannick Jauzion", "William Servat", "Morgan Parra", "François Trinh-Duc", "Maxime Médard",
            "Louis Picamoles", "Lionel Nallet", "Pascal Papé", "Julien Bonnaire", "Sylvain Marconnet",
            "Thomas Castaignède", "Benjamin Fall", "Florian Fritz", "Alexis Palisson", "Fulgence Ouedraogo",
            "Marc Lièvremont", "Fabien Galthié", "Bernard Laporte", "Olivier Magne", "Abdelatif Benazzi",
            "Emile Ntamack", "Denis Charvet", "Serge Blanco", "Philippe Sella", "Jean-Pierre Rives",

            // Stars Internationales emblématiques (30)
            "Jonny Wilkinson", "Dan Carter", "Bryan Habana", "Siya Kolisi", "Cheslin Kolbe",
            "Finn Russell", "Ma'a Nonu", "Bakkies Botha", "Matt Giteau", "Sergio Parisse",
            "Eben Etzebeth", "Jonah Lomu", "Richie McCaw", "Brian O'Driscoll", "Faf de Klerk",
            "Beauden Barrett", "Ardie Savea", "Ange Capuozzo", "Alun Wyn Jones", "Shane Williams",
            "Johnny Sexton", "Owen Farrell", "Maro Itoje", "Courtney Lawes", "Lukhanyo Am",
            "Damian McKenzie", "Will Jordan", "Handré Pollard", "Michael Hooper", "Pablo Matera"
        ];

        const preloadedData = [];
        let currentIndex = 0;
        let isAnswerRevealed = false;

        const loaderScreen = document.getElementById('loader-screen');
        const cardContainer = document.getElementById('card-container');
        const loadStatus = document.getElementById('load-status');
        const progressBar = document.getElementById('progress-bar');
        
        const imgElement = document.getElementById('player-img');
        const nameElement = document.getElementById('player-name');
        const counterElement = document.getElementById('counter');

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        async function fetchImageUrl(playerName) {
            try {
                const res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(playerName)}`);
                const data = await res.json();
                if (data.thumbnail && data.thumbnail.source) {
                    return data.thumbnail.source;
                }
            } catch (e) {}
            return "https://via.placeholder.com/320x400?text=Photo+non+disponible";
        }

        async function initGame() {
            shuffle(players);
            let loadedCount = 0;
            const batchSize = 5;

            for (let i = 0; i < players.length; i += batchSize) {
                const chunk = players.slice(i, i + batchSize);
                const promises = chunk.map(async (name) => {
                    const url = await fetchImageUrl(name);
                    
                    await new Promise((resolve) => {
                        const img = new Image();
                        img.onload = resolve;
                        img.onerror = resolve;
                        img.src = url;
                    });

                    return { name, url };
                });

                const results = await Promise.all(promises);
                preloadedData.push(...results);

                loadedCount += chunk.length;
                loadStatus.textContent = `${loadedCount} / ${players.length} joueurs prêts`;
                progressBar.style.width = `${(loadedCount / players.length) * 100}%`;
            }

            loaderScreen.style.display = 'none';
            cardContainer.style.display = 'flex';
            loadCard();
        }

        function loadCard() {
            isAnswerRevealed = false;
            nameElement.classList.remove('visible');
            
            const currentItem = preloadedData[currentIndex];
            nameElement.textContent = currentItem.name;
            imgElement.src = currentItem.url;
            counterElement.textContent = `${currentIndex + 1} / ${preloadedData.length}`;
        }

        document.addEventListener('keydown', (event) => {
            if (event.code === 'Space' && cardContainer.style.display === 'flex') {
                event.preventDefault();
                
                if (!isAnswerRevealed) {
                    nameElement.classList.add('visible');
                    isAnswerRevealed = true;
                } else {
                    currentIndex = (currentIndex + 1) % preloadedData.length;
                    loadCard();
                }
            }
        });

        initGame();
    </script>
</body>
</html>
