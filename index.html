<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards Rugby - The Floor</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        #loader-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .progress-bar-container {
            width: 300px;
            height: 12px;
            background-color: #333;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 15px;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background-color: #4da6ff;
            transition: width 0.1s ease;
        }

        #card-container {
            background-color: #1e1e1e;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: none;
            flex-direction: column;
            align-items: center;
            width: 380px;
            text-align: center;
        }

        .image-wrapper {
            width: 320px;
            height: 400px;
            border-radius: 12px;
            overflow: hidden;
            background-color: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #player-name {
            font-size: 1.8rem;
            font-weight: bold;
            min-height: 2.2rem;
            color: #4da6ff;
            visibility: hidden;
            margin: 10px 0;
        }

        #player-name.visible {
            visibility: visible;
        }

        .instructions {
            font-size: 0.9rem;
            color: #888888;
            margin-top: 15px;
        }

        #counter {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 10px;
        }

        .key-badge {
            background: #333;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid #555;
            color: #fff;
        }
    </style>
</head>
<body>

    <div id="loader-screen">
        <h2>Préchargement des photos...</h2>
        <div id="load-status">0 / 100 joueurs prêts</div>
        <div class="progress-bar-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
    </div>

    <div id="card-container">
        <div id="counter">1 / 100</div>
        <div class="image-wrapper">
            <img id="player-img" src="" alt="">
        </div>
        <div id="player-name">---</div>
        <div class="instructions">
            Appuyez sur <span class="key-badge">Espace</span> pour révéler / passer à la suivante
        </div>
    </div>

    <script>
        const players = [
            // Françaises
            "Antoine Dupont", "Romain Ntamack", "Thierry Dusautoir", "Serge Blanco", "Frédéric Michalak", 
            "Fabien Pelous", "Vincent Clerc", "Christophe Dominici", "Raphaël Ibañez", "Thomas Ramos",
            "Damian Penaud", "Gregory Alldritt", "Charles Ollivon", "Gaël Fickou", "Mathieu Jalibert",
            "Imanol Harinordoquy", "Philippe Sella", "Jean-Pierre Rives", "Dimitri Yachvili", "Aurélien Rougerie",
            "Sébastien Chabal", "Yannick Jauzion", "William Servat", "Morgan Parra", "Uini Atonio",
            "Cyril Baille", "Julien Marchand", "Camille Chat", "Anthony Jelonch", "Bernard Le Roux",
            "François Trinh-Duc", "Maxime Médard", "Louis Picamoles", "Florian Fritz", "Sylvain Marconnet",

            // Internationales
            "Jonny Wilkinson", "Dan Carter", "Richie McCaw", "Brian O'Driscoll", "Shane Williams",
            "Siya Kolisi", "Cheslin Kolbe", "Eben Etzebeth", "Faf de Klerk", "Bryan Habana",
            "Jonah Lomu", "Beauden Barrett", "Ardie Savea", "Aaron Smith", "Ma'a Nonu",
            "Brodie Retallick", "Kieran Read", "David Pocock", "Michael Hooper", "George Gregan",
            "Maro Itoje", "Owen Farrell", "Courtney Lawes", "Manu Tuilagi", "Alun Wyn Jones",
            "George North", "Louis Rees-Zammit", "Finn Russell", "Stuart Hogg", "Ronan O'Gara",
            "Johnny Sexton", "Tadhg Furlong", "Josh van der Flier", "Sergio Parisse", "Ange Capuozzo",

            // Tendances & Actuels
            "Bundee Aki", "Jamison Gibson-Park", "Hugo Keenan", "Caelan Doris", "Duhan van der Merwe",
            "Marcus Smith", "Ben Earl", "Ellis Genge", "Freddie Steward", "Handré Pollard",
            "Pieter-Steph du Toit", "Lukhanyo Am", "Damian de Allende", "Will Jordan", "Rieko Ioane",
            "Jordie Barrett", "Damian McKenzie", "Scott Barrett", "Pablo Matera", "Emiliano Boffelli",
            "Blair Kinghorn", "Mack Hansen", "James Lowe", "Gabin Villière", "Melvyn Jaminet"
        ];

        const preloadedData = [];
        let currentIndex = 0;
        let isAnswerRevealed = false;

        const loaderScreen = document.getElementById('loader-screen');
        const cardContainer = document.getElementById('card-container');
        const loadStatus = document.getElementById('load-status');
        const progressBar = document.getElementById('progress-bar');
        
        const imgElement = document.getElementById('player-img');
        const nameElement = document.getElementById('player-name');
        const counterElement = document.getElementById('counter');

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        async function fetchImageUrl(playerName) {
            try {
                const res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(playerName)}`);
                const data = await res.json();
                if (data.thumbnail && data.thumbnail.source) {
                    return data.thumbnail.source;
                }
            } catch (e) {}
            return "https://via.placeholder.com/320x400?text=Photo+non+disponible";
        }

        // Préchargement global au démarrage
        async function initGame() {
            shuffle(players);
            let loadedCount = 0;

            // Traitement par lots de 5 requêtes simultanées pour être très rapide
            const batchSize = 5;
            for (let i = 0; i < players.length; i += batchSize) {
                const chunk = players.slice(i, i + batchSize);
                const promises = chunk.map(async (name) => {
                    const url = await fetchImageUrl(name);
                    
                    // Force le navigateur à télécharger physiquement l'image en mémoire
                    await new Promise((resolve) => {
                        const img = new Image();
                        img.onload = resolve;
                        img.onerror = resolve;
                        img.src = url;
                    });

                    return { name, url };
                });

                const results = await Promise.all(promises);
                preloadedData.push(...results);

                loadedCount += chunk.length;
                loadStatus.textContent = `${loadedCount} / ${players.length} joueurs prêts`;
                progressBar.style.width = `${(loadedCount / players.length) * 100}%`;
            }

            // Une fois fini, on masque le chargement et on affiche le jeu
            loaderScreen.style.display = 'none';
            cardContainer.style.display = 'flex';
            loadCard();
        }

        function loadCard() {
            isAnswerRevealed = false;
            nameElement.classList.remove('visible');
            
            const currentItem = preloadedData[currentIndex];
            nameElement.textContent = currentItem.name;
            imgElement.src = currentItem.url;
            counterElement.textContent = `${currentIndex + 1} / ${preloadedData.length}`;
        }

        document.addEventListener('keydown', (event) => {
            if (event.code === 'Space' && cardContainer.style.display === 'flex') {
                event.preventDefault();
                
                if (!isAnswerRevealed) {
                    nameElement.classList.add('visible');
                    isAnswerRevealed = true;
                } else {
                    currentIndex = (currentIndex + 1) % preloadedData.length;
                    loadCard();
                }
            }
        });

        initGame();
    </script>
</body>
</html>
